name: Release

# A version tag (v0.1.0) builds the Windows installer and attaches it to a draft release with
# generated notes; scripts/macos/release.sh then adds the Mac DMG and publishes the release
# (docs/RELEASING.md). Running the workflow by hand, or a pull request that changes the
# packaging, builds the installer as a workflow artifact only, to try it without a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release_version.py"
      - "scripts/windows/Build-Installer.ps1"
      - "windows/installer/**"
      - "windows/helper/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-2025
    permissions:
      contents: write # create the draft release and upload the installer
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An exact SDK version (allowed by windows/app/global.json): since 2026-10-25 the aka.ms links
      # that channel installs use point at a storage account that refuses downloads
      # (dotnet/install-scripts#745), while exact versions come from builds.dotnet.microsoft.com.
      # Go back to global-json-file once that is fixed.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403

      - name: Check the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $arguments = if ($env:REF_TYPE -eq 'tag') { @('--tag', $env:REF_NAME) } else { @() }
          $version = python scripts/release_version.py @arguments
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --allow-downgrade --no-progress -y

      - name: Build the installer
        run: |
          . ./scripts/windows/Enter-DevShell.ps1
          ./scripts/windows/Build-Installer.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Osplay-Setup-${{ steps.version.outputs.version }}
          path: |
            windows/build/installer/Osplay-Setup.exe
            windows/build/installer/Osplay-Setup.exe.sha256
          if-no-files-found: error

      - name: Attach the installer to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = 'windows/build/installer/Osplay-Setup.exe'
          $files = @($installer, "$installer.sha256")
          # A re-run finds the draft it made before and replaces its files.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --draft --verify-tag --generate-notes --title "Osplay $env:VERSION"
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
