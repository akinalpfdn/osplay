name: Feature request
description: Suggest an improvement that fits Osplay's scope.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Osplay is an extended display, not a remote desktop tool: input forwarding is out of scope.
        Check DEVPLAN.md → Post-MVP for features that are already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
