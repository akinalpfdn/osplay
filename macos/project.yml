name: Osplay
options:
  bundleIdPrefix: com.akinalpfdn
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  OsplayCore:
    path: ..
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Osplay:
    type: application
    platform: macOS
    sources:
      - path: Osplay
      # Code the iPad app shares with the Mac app (viewer pipeline, discovery, key store).
      - path: Shared
    dependencies:
      - package: OsplayCore
        product: CoreBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osplay
        PRODUCT_NAME: Osplay
        INFOPLIST_FILE: Osplay/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Osplay/Services/VirtualDisplay/CGVirtualDisplayPrivate.h
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OsplayPad:
    type: application
    platform: iOS
    sources:
      - path: OsplayPad
      - path: Shared
    dependencies:
      - package: OsplayCore
        product: CoreBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osplay.ipad
        PRODUCT_NAME: Osplay
        INFOPLIST_FILE: OsplayPad/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OsplayPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OsplayPadTests
      - path: OsplayTests/Support/InMemoryKeyStore.swift
    dependencies:
      - target: OsplayPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osplay.ipad.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Osplay.app/Osplay
  OsplayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OsplayTests
    dependencies:
      - target: Osplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osplay.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Osplay.app/Contents/MacOS/Osplay
  OsplayHardwareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OsplayHardwareTests
    dependencies:
      - target: Osplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osplay.hardwaretests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Osplay.app/Contents/MacOS/Osplay
schemes:
  OsplayPad:
    build:
      targets:
        OsplayPad: all
        OsplayPadTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OsplayPadTests
  Osplay:
    build:
      targets:
        Osplay: all
        OsplayTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OsplayTests
  # Creates real virtual displays on the machine running it; not part of CI.
  OsplayHardware:
    build:
      targets:
        Osplay: all
        OsplayHardwareTests: [test]
    test:
      config: Debug
      targets:
        - OsplayHardwareTests
